openapi: '3.0.0'
info:
  version: 1.0.0
  title: Appsumo API
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /deals:
    get:
      summary: List all deals
      operationId: listDeals
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: An paged array of deals
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deals'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a deal
      operationId: createDeals
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deals/{dealId}:
    get:
      summary: Info for a deal
      operationId: showDealById
      parameters:
        - name: dealId
          in: path
          required: true
          description: The id of the deal to retrieve
          schema:
            type: string
      responses:
        200:
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deals'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases:
    get:
      summary: List all purchases
      operationId: listPurchases
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: An paged array of purchases
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchases'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a purchase
      operationId: createPurchases
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchaseId}:
    get:
      summary: Info for a purchase
      operationId: showPurchaseById
      parameters:
        - name: purchaseId
          in: path
          required: true
          description: The id of the purchase to retrieve
          schema:
            type: string
      responses:
        200:
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchases'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Deal:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
    Deals:
      type: array
      items:
        $ref: '#/components/schemas/Deal'
    Purchase:
      required:
        - id
        - dealId
      properties:
        id:
          type: integer
          format: int64
        dealId:
          type: integer
          format: int64
        quantity:
          type: integer
    Purchases:
      type: array
      items:
        $ref: '#/components/schemas/Purchase'
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string